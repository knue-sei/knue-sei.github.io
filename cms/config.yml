# 웹 관리자(Decap CMS) 설정 — https://knue-sei.github.io/admin/
# 글을 저장하면 저장소 content/ 폴더에 커밋되고, GitHub Actions가 1~2분 안에 사이트를 다시 게시합니다.
backend:
  name: github
  repo: knue-sei/knue-sei.github.io
  branch: main
  # GitHub 로그인 중계(OAuth). README의 "웹 관리자 로그인 설정" 참고
  base_url: https://api.netlify.com
  site_domain: knue-sei-cms.netlify.app   # ← 실제 만든 Netlify 사이트 주소로 변경
  commit_messages:
    create: "글 작성: {{collection}} {{slug}}"
    update: "글 수정: {{collection}} {{slug}}"
    delete: "글 삭제: {{collection}} {{slug}}"
    uploadMedia: "파일 업로드: {{path}}"
    deleteMedia: "파일 삭제: {{path}}"

locale: ko
site_url: https://knue-sei.github.io
display_url: https://knue-sei.github.io
logo_url: /assets/knue-official-logo.svg

media_folder: uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: events
    label: 학술행사
    label_singular: 학술행사
    folder: content/events
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    identifier_field: title
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 제목 (영문), name: title_en, widget: string, required: false, hint: "비워 두면 영문판에 한글 내용이 표시됩니다." }
      - { label: 개최일, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - { label: 한 줄 소개, name: summary, widget: string, required: false }
      - { label: 한 줄 소개 (영문), name: summary_en, widget: string, required: false }
      - { label: 본문, name: body, widget: text, required: false, hint: "빈 줄로 문단을 나눕니다." }
      - { label: 본문 (영문), name: body_en, widget: text, required: false }
      - label: 행사 사진
        name: photos
        widget: list
        required: false
        hint: "첫 번째 사진이 목록의 대표 사진이 됩니다. JPG·PNG·WEBP·GIF"
        fields:
          - { label: 사진, name: url, widget: image }
          - { label: 사진 설명, name: name, widget: string, required: false }
          - { label: 사진 설명 (영문), name: name_en, widget: string, required: false }
      - label: 포스터 / PDF
        name: attachments
        widget: list
        required: false
        fields:
          - { label: PDF 파일, name: url, widget: file }
          - { label: 표시 이름, name: label, widget: string, hint: "예: 행사 포스터" }
          - { label: 표시 이름 (영문), name: label_en, widget: string, required: false, hint: "예: Event poster" }
          - { label: 내려받을 파일 이름, name: name, widget: string, required: false, hint: "예: 행사 포스터.pdf" }
      - &status { label: 공개 여부, name: status, widget: select, default: published, options: [ { label: 공개, value: published }, { label: 임시저장, value: draft }, { label: 비공개, value: hidden } ], hint: "‘공개’만 사이트에 표시됩니다." }

  - name: publications
    label: 간행물
    label_singular: 간행물
    folder: content/publications
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    identifier_field: title
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { label: 제목, name: title, widget: string, hint: "예: 청람과학교육연구논총 제30권 1호" }
      - { label: 제목 (영문), name: title_en, widget: string, required: false, hint: "비워 두면 영문판에 한글 내용이 표시됩니다." }
      - { label: 발행일, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - { label: 권호, name: volume, widget: string, hint: "예: 제30권 1호" }
      - { label: 권호 (영문), name: volume_en, widget: string, required: false, hint: "예: Vol. 30, No. 1" }
      - { label: 한 줄 소개, name: summary, widget: string, required: false }
      - { label: 한 줄 소개 (영문), name: summary_en, widget: string, required: false }
      - { label: 본문, name: body, widget: text, required: false }
      - { label: 본문 (영문), name: body_en, widget: text, required: false }
      - label: 표지·목차 PDF
        name: attachments
        widget: list
        required: false
        max: 1
        hint: "표지·목차 공개본만 올려 주세요."
        fields:
          - { label: PDF 파일, name: url, widget: file }
          - { label: 표시 이름, name: label, widget: hidden, default: "표지·목차 PDF" }
          - { label: 표시 이름 (영문), name: label_en, widget: hidden, default: "Cover & Contents PDF" }
          - { label: 내려받을 파일 이름, name: name, widget: string, required: false }
      - *status

  - name: news
    label: 소식
    label_singular: 소식
    folder: content/news
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    identifier_field: title
    summary: "{{date}} · {{title}}"
    sortable_fields: [date, title]
    fields:
      - { label: 제목, name: title, widget: string }
      - { label: 제목 (영문), name: title_en, widget: string, required: false, hint: "비워 두면 영문판에 한글 내용이 표시됩니다." }
      - { label: 게시일, name: date, widget: datetime, format: YYYY-MM-DD, date_format: YYYY-MM-DD, time_format: false }
      - { label: 한 줄 소개, name: summary, widget: string, required: false }
      - { label: 한 줄 소개 (영문), name: summary_en, widget: string, required: false }
      - { label: 본문, name: body, widget: text, required: false, hint: "빈 줄로 문단을 나눕니다." }
      - { label: 본문 (영문), name: body_en, widget: text, required: false }
      - label: 첨부 PDF
        name: attachments
        widget: list
        required: false
        fields:
          - { label: PDF 파일, name: url, widget: file }
          - { label: 표시 이름, name: label, widget: string }
          - { label: 표시 이름 (영문), name: label_en, widget: string, required: false, hint: "예: Event poster" }
          - { label: 내려받을 파일 이름, name: name, widget: string, required: false }
      - *status
